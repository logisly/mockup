<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LOGISLY Prototype</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#0f172a;color:#fff;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:100%;padding:24px 20px;
}
.hub{display:flex;flex-direction:column;align-items:center;width:100%;max-width:380px}
.logo{
  background:#00b4bd;padding:10px 24px;border-radius:14px;
  font-size:22px;font-weight:900;letter-spacing:2px;color:#fff;
  margin-bottom:14px;
}
.hub-title{font-size:17px;font-weight:700;color:#e2e8f0;margin-bottom:4px}
.hub-sub{font-size:13px;color:#475569;margin-bottom:36px}
.btns{display:flex;flex-direction:column;gap:14px;width:100%}
.btn{
  display:flex;align-items:center;gap:16px;
  background:#1e293b;border:1.5px solid #334155;border-radius:18px;
  padding:20px 18px;cursor:pointer;width:100%;
  transition:border-color .15s,box-shadow .15s,transform .1s;
}
.btn:active{transform:scale(0.97)}
.btn.d:hover{border-color:#00b4bd;box-shadow:0 8px 28px rgba(0,180,189,.3)}
.btn.i:hover{border-color:#f59e0b;box-shadow:0 8px 28px rgba(245,158,11,.3)}
.icon{width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.id{background:rgba(0,180,189,.15)}
.ii{background:rgba(245,158,11,.15)}
.binfo{flex:1;text-align:left}
.btitle{font-size:16px;font-weight:800;color:#f1f5f9;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px}
.cd{background:rgba(0,180,189,.15);color:#00b4bd}
.ci{background:rgba(245,158,11,.15);color:#f59e0b}
.arr{font-size:22px;color:#475569;flex-shrink:0}
footer{margin-top:32px;font-size:11px;color:#334155;text-align:center}

/* overlay */
#ov{display:none;position:fixed;inset:0;flex-direction:column;background:#000;z-index:999;width:100%;height:100%}
#ov.on{display:flex}
.ovbar{
  display:flex;align-items:center;gap:10px;flex-shrink:0;
  background:#111827;border-bottom:1px solid #1e293b;
  padding:12px 16px;
}
.bk{
  background:rgba(255,255,255,.08);border:none;color:#fff;
  width:38px;height:38px;border-radius:10px;font-size:22px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.ovtitle{font-size:14px;font-weight:700;color:#e2e8f0}
.ovbadge{margin-left:auto;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px}
.bt{background:rgba(0,180,189,.15);color:#00b4bd}
.bi{background:rgba(245,158,11,.15);color:#f59e0b}
#fr{flex:1;width:100%;border:none;display:block}
</style>
</head>
<body>
<div class="hub">
  <div class="logo">LOGISLY</div>
  <div class="hub-title">Transporter App</div>
  <div class="hub-sub">Pilih flow yang ingin kamu coba</div>
  <div class="btns">
    <button class="btn d" onclick="op('d')">
      <div class="icon id">&#128665;</div>
      <div class="binfo">
        <div class="btitle">Dispatch Order</div>
        <div class="chips">
          <span class="chip cd">Open order</span>
          <span class="chip cd">Dispatch</span>
          <span class="chip cd">Konfirmasi order</span>
          <span class="chip cd">Detail order</span>
        </div>
      </div>
      <span class="arr">&#8250;</span>
    </button>
    <button class="btn i" onclick="op('i')">
      <div class="icon ii">&#129534;</div>
      <div class="binfo">
        <div class="btitle">Invoice</div>
        <div class="chips">
          <span class="chip ci">Ajukan invoice</span>
          <span class="chip ci">Detail invoice</span>
          <span class="chip ci">Upload SJ</span>
        </div>
      </div>
      <span class="arr">&#8250;</span>
    </button>
  </div>
  <footer>LOGISLY &middot; Transporter App v1.0 &middot; May 2026</footer>
</div>

<div id="ov">
  <div class="ovbar">
    <button class="bk" onclick="cl()">&#8249;</button>
    <span class="ovtitle" id="ot"></span>
    <span class="ovbadge" id="ob"></span>
  </div>
  <iframe id="fr" allowfullscreen></iframe>
</div>
