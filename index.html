*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#0f172a;color:#fff;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:100%;padding:24px 20px;
}
.hub{display:flex;flex-direction:column;align-items:center;width:100%;max-width:380px}
.logo{
  width:210px;height:36px;margin-bottom:18px;
  background-image:var(--logo-ondark);
  background-repeat:no-repeat;background-position:center;background-size:contain;
  text-indent:-9999px;white-space:nowrap;overflow:hidden;
}
.hub-title{font-size:17px;font-weight:700;color:#e2e8f0;margin-bottom:4px}
.hub-sub{font-size:13px;color:#475569;margin-bottom:36px}
.btns{display:flex;flex-direction:column;gap:14px;width:100%}
.btn{
  display:flex;align-items:center;gap:16px;
  background:#1e293b;border:1.5px solid #334155;border-radius:18px;
  padding:20px 18px;cursor:pointer;width:100%;
  transition:border-color .15s,box-shadow .15s,transform .1s;
}
.btn:active{transform:scale(0.97)}
.btn.d:hover{border-color:#00b4bd;box-shadow:0 8px 28px rgba(0,180,189,.3)}
.btn.i:hover{border-color:#f59e0b;box-shadow:0 8px 28px rgba(245,158,11,.3)}
.icon{width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.id{background:rgba(0,180,189,.15)}
.ii{background:rgba(245,158,11,.15)}
.binfo{flex:1;text-align:left}
.btitle{font-size:16px;font-weight:800;color:#f1f5f9;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px}
.cd{background:rgba(0,180,189,.15);color:#00b4bd}
.ci{background:rgba(245,158,11,.15);color:#f59e0b}
.arr{font-size:22px;color:#475569;flex-shrink:0}
footer{margin-top:32px;font-size:11px;color:#334155;text-align:center}

/* overlay */
#ov{display:none;position:fixed;inset:0;flex-direction:column;background:#000;z-index:999;width:100%;height:100%}
#ov.on{display:flex}
.ovbar{
  display:flex;align-items:center;gap:10px;flex-shrink:0;
  background:#111827;border-bottom:1px solid #1e293b;
  padding:12px 16px;
}
.bk{
  background:rgba(255,255,255,.08);border:none;color:#fff;
  width:38px;height:38px;border-radius:10px;font-size:22px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.ovtitle{font-size:14px;font-weight:700;color:#e2e8f0}
.ovbadge{margin-left:auto;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px}
.bt{background:rgba(0,180,189,.15);color:#00b4bd}
.bi{background:rgba(245,158,11,.15);color:#f59e0b}
#fr{flex:1;width:100%;border:none;display:block}
</style>
</head>

  function load(fr,uri){
    // srcdoc instead of a data: URL — data: frames get blocked by CSP in some viewers
    var b64=uri.slice(uri.indexOf(',')+1);
    var bin=atob(b64);
    var bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++){bytes[i]=bin.charCodeAt(i);}
    fr.removeAttribute('src');
    fr.srcdoc=new TextDecoder('utf-8').decode(bytes);
  }
  window.op=function(t){
    var ov=document.getElementById('ov');
    var fr=document.getElementById('fr');
    var ot=document.getElementById('ot');
    var ob=document.getElementById('ob');
    if(t==='d'){
      ot.textContent='Dispatch Order';
      ob.textContent='Dispatch Flow';
      ob.className='ovbadge bt';
      load(fr,dSrc);
    }else{
      ot.textContent='Invoice';
      ob.textContent='Invoice Flow';
      ob.className='ovbadge bi';
      load(fr,iSrc);
    }
    ov.classList.add('on');
  };
  window.cl=function(){
    document.getElementById('ov').classList.remove('on');
    var fr=document.getElementById('fr');
    fr.removeAttribute('srcdoc');
    fr.src='about:blank';
  };
})();
